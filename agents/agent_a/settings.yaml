# Agent A: the plain chain, Pipecat as it comes (Part 2). Ears -> brain -> voice.
# Each value is a decided one; the decision is named beside it.

# The same first line as every robot in the lab, so no robot gets a better
# opening, and no brain request is spent on a greeting (free tier, 15 Nov 2026).
greeting: "Namaste, Hearken Food se bol raha hoon. Bataiye?"

brain:
  # Decision 2, changed 15 Nov 2026: no paid tier, and the free 3.8 Flash allows
  # only 20 requests a day. Free Flash-Lite allows 500.
  model: gemini-3.5-flash-lite

ears:  # decision 24 (2 Nov 2026): best on key details, heard something on every noisy clip
  model: saaras:v3-realtime
  language: hi-IN
  mode: translit
  stream_type: fast
  silence_ms: 250

voice:  # decision 12
  model: bulbul:v4-flash
  speaker: sunny_enhi_customer
  language: hi-IN

# Pipecat's one-line background-tool switch (Part 7's extra run). Off: the brain
# waits for each tool, and a caller cutting in cancels the wait.
background_tools: false
