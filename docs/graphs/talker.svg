<svg xmlns="http://www.w3.org/2000/svg" width="1070" height="880" viewBox="0 0 1070 880" role="img" aria-label="The Talker graph as built in build_talker_graph: five waits, the steps each one routes to, and the steps every wait can reach."><defs><marker id="arrQ" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><style>
svg{--bg:#f6f7f4;--fg:#1d211c;--muted:#5c6658;--ai:#b6542a;--code:#2f6b4f;--card:#ffffff;color:var(--muted)}
@media (prefers-color-scheme:dark){svg{--bg:#151814;--fg:#e8ece4;--muted:#9aa494;--ai:#e08a62;--code:#6fbf95;--card:#1c201b;}}
.bg{fill:var(--card);stroke:var(--muted);stroke-opacity:.35}
.box{fill:var(--card);stroke-width:2}
.b-code{stroke:var(--code)}
.b-ai{stroke:var(--ai);stroke-width:2.5}
.b-wait{stroke:var(--fg);stroke-width:1.6;stroke-dasharray:2 3}
.b-end{stroke:var(--fg);stroke-width:2}
.ln{fill:none;stroke:currentColor;stroke-width:1.6}
.ln-d{stroke-dasharray:4 3}
.dot{fill:currentColor}
.t-mono{fill:var(--fg);font-family:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;font-size:12.5px;font-weight:600;text-anchor:middle}
.t-kind{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:10px;text-anchor:middle}
.k-ai{fill:var(--ai);font-weight:600}
.k-code{fill:var(--code);font-weight:600}
.k-wait{fill:var(--muted)}
.pill{fill:var(--bg);stroke:var(--muted);stroke-width:1}
.t-pill{fill:var(--fg);font-family:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;font-size:11px;text-anchor:middle}
.lbl,.lbl-s,.lbl-e{fill:var(--fg);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:11px;font-weight:500}
.lbl{text-anchor:middle}.lbl-s{text-anchor:start}.lbl-e{text-anchor:end}
.lblbg{fill:var(--card)}
