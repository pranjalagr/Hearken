# Giving up (C12), and the safe line when the brain's answer can't be used.
"Chhodiye, rehne dijiye. Bye.": "छोड़िए, रहने दीजिए। बाय।"
"Ek minute, phir se bataiye.": "एक मिनट, फिर से बताइए।"
