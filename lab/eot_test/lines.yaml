# The end-of-turn test sentences (Part 2, decision 25): what a pretend caller says.
#
# Each has exactly one "...", where the caller pauses. No commas, because the voice pauses
# at commas too, and the clip is cut at the longest pause: one pause keeps the cut at the
# "...". Verbs avoid "raha/rahi", because each line is said by male and female voices.
# Made-up orders, names and addresses only.

