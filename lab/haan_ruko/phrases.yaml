# ---- mixed: starts like listening, then becomes speech ------------------------------
# The first comma is where the answer changes: keep before it, stop after it. The voice
# pauses there, and the voice detector finds that pause.
mixed:
  train:
    - haan, lekin SMS aayega na?
    - achha, ek baat batao
    - haan, par refund kab aayega?
    - ji, lekin address galat hai
    - theek hai, but cancel mat karna
    - hmm, ek minute ruko
    - haan haan, lekin order number galat hai
    - ok, par paise kab aayenge?
    - achha, sorry, ek baat
    - ji, wo naam galat bola aapne
    - haan, actually kuch aur poochna hai
    - theek hai, lekin kitni der lagegi?
    - achha, nahi nahi, ruko
    - haan, but mujhe UPI pe chahiye
    - achha, toh delivery kab hogi?
    - ji, par maine toh card se pay kiya tha
    - theek hai, aur doosre order ka kya?
    - haan, lekin pehle ye batao
    - ok, but the address is wrong
    - yes, but I want a refund
    - achha, matlab ab cancel nahi hoga?
    - hmm, lekin rider ne call nahi kiya
    - haan ji, ek aur cheez
    - theek hai theek hai, par jaldi karna
    - ji, sorry, phir se boliye
    - haan, nahi, ruko ek minute
    - achha, toh paise kab tak aayenge?
    - ok ok, lekin order cancel mat karna
    - right, but what about my refund?
    - achha, wait wait
    - bilkul, lekin ek sawaal hai
    - haan, kitne din lagenge?
    - ji haan, lekin wo order alag hai
    - okay, aur agar rider aa gaya toh?
    - hmm hmm, par mujhe manager se baat karni hai
  held_back:
    - haan, wait
    - ok, one question
    - ji, lekin pehle confirm karo
    - achha, phir kya hoga?
    - theek hai, but jaldi please

# ---- stop: ordinary caller sentences ----------------------------------------------
# Taken by code from our existing test sentences, a fixed sample, so the model learns that
# any real speech means stop, not one particular word.
sentences:
  from:
    - lab/week1/number_transcripts.py   # the 831 order-number turns
    - lab/eot_test/lines.yaml           # the 60 end-of-turn sentences, without the "..."
  count: 250
  held_back_share: 0.1

# ---- keep: sounds that aren't speech ------------------------------------------------
not_speech:
  noise_files: [traffic, kitchen, crowd]  # already in lab/sounds/noise
  still_needed: [cough, laugh, tv, breathing, sneeze]  # no files yet: free ones to be found, like the noise files
