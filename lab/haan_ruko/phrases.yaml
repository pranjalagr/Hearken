# What a caller says while the robot is talking (Part 4, the "haan vs ruko" model).
#
# The model learns one question: "is this a short listening sound?" If yes, the robot keeps
# talking. Anything else is real speech, and the robot stops. Listening sounds are a small set,
# so we try to list them all; real speech is endless, so we give the model a big, varied pile
# of it instead of only "ruko" (the user, 10 Nov 2026). Widened the same day at the user's ask.
#
# held_back: never trained on, only tested, to see if the model handles what it never heard.
# Made-up details only: no real names, numbers or addresses. Both "gaya" and "gayi" forms
# are listed where a word changes with the speaker, because the voices are male and female.

# ---- keep: "I'm listening, go on" -------------------------------------------------
keep:
  train:
    - haan
    - haan ji
    - hmm
    - hmm hmm
    - hmmm
    - mm-hmm
    - uh-huh
    - achha
    - achha achha
    - ji
    - ji ji
    - ji haan
    - theek hai
    - theek hai theek hai
    - theek
    - ok
    - okay
    - ok ok
    - ok ji
    - right
    - right right
    - sahi hai
    - sahi
    - haan haan
    - haan haan haan
    - haan bilkul
    - bilkul
    - bilkul bilkul
    - "yes"  # quoted: unquoted, YAML reads it as true
    - yes yes
    - yeah
    - yep
    - sure
    - haan theek hai
    - achha theek hai
    - haan sahi
    - oh achha
    - achha haan
    - haan ji boliye
    - haan boliye
    - ji boliye
    - hmm achha
    - achha achha theek hai
    - got it
    - oh ok
    - oh okay
    - haan haan theek hai
    - ji sir
    - ji madam
    - samajh gaya
    - samajh gayi
    - achha samjha
    - theek hai bhaiya
    - ji bhaiya
    - ok bhaiya
    - achha bhai
    - haan yaar
    - hmm theek hai
    - perfect
    - great
  held_back:
    - achha ji
    - haan bolo
    - yeah yeah
    - ji bilkul
    - okay okay
    - haan bhaiya
    - I see
    - theek hai ji

# ---- stop: short, clear interruptions -----------------------------------------------
