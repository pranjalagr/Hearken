    - ruko ruko
    - ruko na
    - ek minute
    - ek second
    - ek min
    - nahi nahi
    - nahi
    - nahin
    - wait
    - wait wait
    - wait a minute
    - suniye
    - suniye na
    - suno
    - suno suno
    - sorry sorry
    - sorry
    - hello?
    - hello hello
    - hello, sun rahe ho?
    - mat karo
    - mat karna
    - bas bas
    - bas karo
    - arre ruko
    - arre nahi
    - excuse me
    - one second
    - one minute
    - stop
    - stop stop
    - bhaiya ek baat
    - bhaiya suniye
    - madam ek minute
    - rukiye
    - ruko zara
    - nahi wo
    - haan wait
    - hang on
