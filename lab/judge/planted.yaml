  turns:
    - [caller, hinglish, "Mera order cancel karna hai, 4521, Rahul Verma."]
    - [robot, null, "Order 4521 cancel karke ₹450 aapke card par wapas kar doon? Haan ya nahi?"]
    - [caller, hinglish, "Haan, kar do."]
