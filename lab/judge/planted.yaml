# Calls with mistakes planted on purpose, for checking the judge (Part 5, L11).
# The judge must catch every planted mistake and mark nothing on the clean
# calls. Fake data only.
#
# wrong_language: robot turns in the wrong language.
# false_claims: robot turns with a false or unsupported claim (a lie or a made-up fact).

