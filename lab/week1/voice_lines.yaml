# Added after the screening round (1 Nov 2026): E3's "₹249.50" was read as a
# decimal by 4 of 5 voices (Sarvam: "dashamlav paanch rupaye"; Google:
# "point five zero"). E8 is the same failure for English callers; E9-E11 try
# decision 10's smallest fix: still digits, but the units written as words.
- id: E8
  category: money
  lang: en
  text: "Your refund will be ₹249.50."
  listen: '"two hundred forty-nine rupees and fifty paise". BAD: "point five", "point five zero". Compare with E11.'
- id: E9
  category: money
  lang: hi
  text: "Refund 249 rupaye 50 paise ka hoga."
  listen: '"do sau unchaas rupaye pachaas paise". Compare with E3.'
- id: E10
  category: money
  lang: hi
  text: "Refund ₹249 aur 50 paise ka hoga."
  listen: '"do sau unchaas rupaye aur pachaas paise": the ₹ sign kept. Compare with E3 and E9.'
- id: E11
  category: money
  lang: en
  text: "Your refund will be 249 rupees 50 paise."
  listen: '"two hundred forty-nine rupees fifty paise". Compare with E8.'

# ---- F: the yes-questions, exactly as the backend writes them (decision 9) ----------
- id: F1
  category: yes-questions
  lang: hi
  text: "Order 4521 cancel karke ₹450 aapke card par wapas kar doon? Haan ya nahi?"
  listen: Every fact clear (order, amount, card). Ends as a question. The most important line type.
- id: F2
  category: yes-questions
  lang: hi
  text: "Order 4530 cancel karke ₹240 aapke UPI par wapas kar doon? Haan ya nahi?"
  listen: '"do sau chaalees rupaye". "UPI" as letters.'
- id: F3
  category: yes-questions
  lang: hi
  text: "Order 4533 cancel kar doon? Cash on delivery tha, toh koi refund nahi banega. Haan ya nahi?"
  listen: Long, three parts. Each part clear, with small pauses between.
- id: F4
  category: yes-questions
  lang: hi
  text: "Order 4512 par ₹40 aapke UPI par wapas bhej doon, kyunki item missing tha? Haan ya nahi?"
  listen: '"item missing" in English. A question.'
- id: F5
  category: yes-questions
  lang: hi
  text: "Order 4561 ka address badal kar \"Flat 2C, Rose Apartments, Model Town, Ludhiana\" kar doon? Haan ya nahi?"
  listen: The quote marks are NOT read out. "2C" said as "two C" or "do C".
- id: F6
  category: yes-questions
  lang: en
  text: "Shall I cancel order 4521 and send ₹450 back to your card? Yes or no?"
  listen: The English version. Every fact clear.
- id: F7
  category: yes-questions
  lang: en
  text: "Shall I change the address of order 4561 to \"Flat 2C, Rose Apartments, Model Town, Ludhiana\"? Yes or no?"
  listen: Quote marks not read out. The address clear.
# Added 1 Nov 2026 with decision 10's money fix: the backend's own question for
# an amount with paise, now said with its units as words.
- id: F8
  category: yes-questions
  lang: hi
  text: "Order 4512 par 120 rupaye 50 paise aapke UPI par wapas bhej doon, kyunki item kharab tha? Haan ya nahi?"
  listen: '"ek sau bees rupaye pachaas paise". BAD: "dashamlav", "point". Still clearly a question.'
- id: F9
  category: yes-questions
  lang: en
  text: "Shall I send 120 rupees 50 paise back to your UPI for order 4512, because an item was damaged? Yes or no?"
  listen: '"one hundred twenty rupees fifty paise". BAD: "point five".'

