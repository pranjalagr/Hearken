# The week-1 voice test lines (Part 2, decisions 10 and 12).
#
# Every line is written to catch one way a voice can fail on our calls. Each
# says what to listen for. The same text goes to every voice, as the Talker
# would write it: English letters, plain digits, the ₹ sign (decision 10:
# nothing special is done to numbers).
#
# lang: hi for Hindi or Hinglish lines, en for English lines.
# The F lines and the G lines must stay word-for-word what the backend says
# (a test checks them against packs/food/spoken.yaml).

# ---- A: everyday Hinglish ------------------------------------------------------
- id: A1
  category: everyday
  lang: hi
  text: "Namaste, Hearken Food se bol raha hoon. Bataiye, main aapki kya madad kar sakta hoon?"
  listen: Warm, not robotic. "Hearken" said like the English word. Ends like a question.
- id: A2
  category: everyday
  lang: hi
  text: "Ek second, main check kar raha hoon."
  listen: '"check" in English. Calm, not rushed.'
- id: A3
  category: everyday
  lang: hi
  text: "Maaf kijiye, aawaz saaf nahi aayi. Ek baar phir bolenge?"
  listen: '"aawaz" with a long "aa". The voice rises at the end, like a question.'
- id: A4
  category: everyday
  lang: hi
  text: "Aapka swagat hai. Hearken Food ko call karne ke liye dhanyavaad!"
  listen: '"dhanyavaad" clear. Friendly.'
- id: A5
  category: everyday
  lang: hi
  text: "Thoda sa time lagega, line par rahiye."
  listen: A silence filler (decision 11). Sounds like a person, not a recording.
- id: A6
  category: everyday
  lang: hi
  text: "Hello, aap sun rahe hain?"
  listen: The silence check (decision 13). A real question, not a statement.
- id: A7
  category: everyday
  lang: hi
  text: "Lagta hai line kat gayi. Dobara call kijiye."
  listen: '"kat gayi" (cut), not the English word "cat".'
- id: A8
  category: everyday
  lang: hi
  text: "Main ek automated assistant hoon."
  listen: '"Main" is the Hindi "main" (I). "automated assistant" in English.'

# ---- B: English words inside Hindi ------------------------------------------------
- id: B1
  category: english-in-hindi
  lang: hi
  text: "Aapka order cancel karke refund process kar diya hai."
  listen: '"order", "cancel", "refund", "process" said as English words; the rest Hindi.'
- id: B2
  category: english-in-hindi
  lang: hi
  text: "Delivery address change karna hai toh naya address bataiye."
  listen: '"delivery address", "change" in English. "toh" short.'
- id: B3
  category: english-in-hindi
  lang: hi
  text: "Kya main aapko team member se connect kar doon?"
  listen: '"team member", "connect" in English. A question.'
- id: B4
  category: english-in-hindi
  lang: hi
  text: "Aapka payment UPI se hua tha."
  listen: '"UPI" as three letters, U-P-I. Not a word like "oopi".'
- id: B5
  category: english-in-hindi
  lang: hi
  text: "Restaurant ne abhi order accept nahi kiya hai."
  listen: '"restaurant", "accept" in English.'
- id: B6
  category: english-in-hindi
  lang: hi
  text: "Rider ki live location main nahi dekh sakta."
  listen: '"live" as in "live location" (lyve), not "liv". "main" is Hindi (I).'

# ---- C: English, for English-speaking callers --------------------------------------
- id: C1
  category: english
  lang: en
  text: "I'm sorry about that. Could you tell me your order number and the name on the order?"
  listen: Natural Indian English. A question at the end.
- id: C2
  category: english
  lang: en
  text: "Your refund of ₹40 has gone back to your UPI."
  listen: '"forty rupees". "UPI" as letters.'
- id: C3
  category: english
  lang: en
  text: "Sorry, order 4540 is already out for delivery, so it can't be cancelled."
  listen: How 4540 is read in English. "can't" clear.
- id: C4
  category: english
  lang: en
  text: "Shall I connect you to a team member?"
  listen: A real question.

# ---- D: order numbers (decision 10) ----------------------------------------------
- id: D1
  category: order-numbers
  lang: hi
  text: "Aapka order number 4521 hai."
  listen: 'GOOD: digit by digit ("chaar paanch do ek" or "four five two one"). BAD: one big number ("chaar hazaar paanch sau ikkees").'
- id: D2
  category: order-numbers
  lang: hi
  text: "Order 4530 mil gaya."
  listen: The 0 at the end is said, not dropped.
- id: D3
  category: order-numbers
  lang: hi
  text: "Order 4505 ka status bata raha hoon."
  listen: The 0 in the middle is said.
- id: D4
  category: order-numbers
  lang: hi
  text: "Order 4500 cancel ho gaya."
  listen: Both zeros said. BAD if it says "four thousand five hundred".
- id: D5
  category: order-numbers
  lang: hi
  text: "Aapke do order hain, 4512 aur 4521. Kaunsa cancel karna hai?"
  listen: The two numbers sound clearly different. "do" here means two.
- id: D6
  category: order-numbers
  lang: hi
  text: "Aapka order number 4 5 2 1 hai."
  listen: Decision 10's first fix (spaces between digits). Is it read digit by digit?
- id: D7
  category: order-numbers
  lang: hi
  text: "Aapka order number chaar paanch do ek hai."
  listen: Numbers already written as Hindi words. Read correctly?

# ---- E: money ----------------------------------------------------------------
- id: E1
  category: money
  lang: hi
  text: "₹450 aapke card par wapas aa jayenge."
  listen: '"chaar sau pachaas rupaye" (or "four fifty rupees"). BAD: "rupees four five zero".'
- id: E2
  category: money
  lang: hi
  text: "₹40 wapas bhej diye hain."
  listen: '"chaalees rupaye".'
- id: E3
  category: money
  lang: hi
  text: "Refund ₹249.50 ka hoga."
  listen: 'The paise: "do sau unchaas rupaye pachaas paise". BAD: "point five zero".'
