id: food_02_cancel_raced_by_dispatch
pack: food
goal: >
  You are Aman Gupta. Cancel order 4530 (paid by UPI). While the agent is
  asking "cancel kar doon?", the rider picks the order up.
uses: [4530]
jobs: [cancel_order]
# The caller doesn't know about the rider: that is the timeline's secret (C6).
caller:
  name: Aman Gupta
  facts:
    order_no: 4530
    paid_by: upi
  wants: cancel the order
  personality: in_a_hurry
  language: mostly_hindi
  voice: male_young
  number_style: hindi_pairs
  noise: {kind: traffic, level: medium}
  tricks: [corrects_number_once]
  opening_line: "Haan hello, mera order cancel karna hai"
# The race happens "right after prepare", and plain mode has no prepare step.
modes: [safe]
timeline:
  - target: "4530"
    change: out_for_delivery
    after_event: prepared:cancel_order
expect:
  # The order left first, so the cancel must be refused and no money may move.
  - table: orders
    where: {order_no: 4530}
    fields: {status: out_for_delivery}
  - table: refunds
    where: {order_no: 4530}
    count: 0
forbid:
  - action: cancel_order
# The owner's rule (17 Nov 2026, kept): a caller who insists on a refused request after one
# explanation is handed to a person. That is a right call here, so a hand-over for this order
# is allowed (19 Nov 2026, the owner's choice), not required: a caller who accepts the "no"
# needs none.
allow:
  - table: handoffs
    where: {order_no: 4530}
