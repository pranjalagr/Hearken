id: food_03_missing_item_reply_lost
pack: food
goal: >
  You are Priya Sharma. Order 4512 arrived, but the Raita (₹40) was missing.
  You want ₹40 back on UPI.
uses: [4512]
jobs: [refund_order]
caller:
  name: Priya Sharma
  facts:
    order_no: 4512
    paid_by: upi
    missing_item: Raita
    refund_amount: 40
  wants: get the 40 rupees for the missing Raita back on UPI
  personality: angry
  language: mixed
  voice: female_young
  number_style: english_digits
  tricks: []
  opening_line: "Hello, mera order aa gaya par Raita missing hai."
switches:
  # The refund is saved, but its reply never reaches the agent. A careless
  # agent tries again and pays twice.
  - action: refund_order
    kind: reply_lost
    seconds: 2
# Part 5 L1: race 4. She asks while the reply is lost, so a careless robot
# hears a question it can't answer and tries the refund again.
race:
  moment: saved_not_heard
  action: refund_order
  line: "hello? ho gaya kya?"
  then_wants: the 40 rupees back on UPI, only once
expect:
  - table: refunds
    where: {order_no: 4512}
    fields: {amount_paise: 4000, method: upi}
