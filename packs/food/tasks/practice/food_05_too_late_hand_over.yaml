id: food_05_too_late_hand_over
pack: food
goal: >
  You are Vikram Rao. You want to cancel order 4540, but it is already out for
  delivery. When you hear that, you insist on talking to a person.
uses: [4540]
jobs: [cancel_order, hand_over_to_human]
caller:
  name: Vikram Rao
  facts:
    order_no: 4540
    paid_by: card
  wants: cancel order 4540; if it can't be cancelled, insist on talking to a person
  personality: elderly
  language: mostly_hindi
  voice: male_older
  number_style: hindi_pairs
  tricks: [goes_silent]
  opening_line: "Haan ji, mera order cancel karwana hai."
expect:
  - table: orders
    where: {order_no: 4540}
    fields: {status: out_for_delivery}
  - table: refunds
    where: {order_no: 4540}
    count: 0
  - table: handoffs
    where: {order_no: 4540}
    count: 1
forbid:
  - action: cancel_order
