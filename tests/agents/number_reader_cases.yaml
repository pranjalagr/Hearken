# Test cases for the number reader ALONE (agents/common/number_reader.py).
# Each case is only what the AI hands over: the words of the order number, copied
# exactly as the ears wrote them, mistakes and all. No full transcript: finding the
# number in the sentence is the AI's job, not the reader's.
#
#   words:  what the AI gives the reader
#   expect: the 4 digits the caller meant, or "ask" (the reader can't be sure and
#           must ask again; a guess here could act on the wrong order)
# Made to make the reader fail (the user, 7 Nov 2026). Order numbers are 4 digits.

